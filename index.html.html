                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="flex flex-col">
                      <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Full Name</label>
                      <input type="text" required value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="border-b border-gray-300 py-2 focus:outline-none focus:border-black transition-colors" placeholder="Jane Doe" />
                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Email</label>
                      <input type="email" required value={formData.email} onChange={(e) => setFormData({...formData, email: e.target.value})} className="border-b border-gray-300 py-2 focus:outline-none focus:border-black transition-colors" placeholder="jane@example.com" />
                    </div>
                  </div>
                  
                  <div className="flex flex-col">
                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Phone Number</label>
                    <input type="tel" required value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} className="border-b border-gray-300 py-2 focus:outline-none focus:border-black transition-colors" placeholder="+92 300 0000000" />
                  </div>

                  <div className="flex flex-col mt-6">
                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Service</label>
                    <select value={formData.service} onChange={(e) => setFormData({...formData, service: e.target.value})} className="border-b border-gray-300 py-2 focus:outline-none focus:border-black transition-colors bg-white">
                      <option value="">Select a service (Optional)</option>
                      {SERVICES_DATA.map(s => <option key={s.id} value={s.title}>{s.title}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div className="flex flex-col">
                      <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Preferred Date</label>
                      <input type="date" required value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} className="border-b border-gray-300 py-2 focus:outline-none focus:border-black transition-colors" />
                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Preferred Time</label>
                      <input type="time" required value={formData.time} onChange={(e) => setFormData({...formData, time: e.target.value})} className="border-b border-gray-300 py-2 focus:outline-none focus:border-black transition-colors" />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-black text-white py-4 rounded-full font-bold mt-10 hover:bg-gray-800 transition-colors active:scale-95">
                    Confirm Booking Request
                  </button>
                </form>
              </motion.div>
            </motion.div>
          )}
        </AnimatePresence>
      );
    };

    const App = () => {
      const [selectedService, setSelectedService] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const [isBookingModalOpen, setIsBookingModalOpen] = useState(false);
      const [preselectedService, setPreselectedService] = useState('');

      const handleOpenBooking = (serviceTitle = '') => {
        setPreselectedService(serviceTitle);
        setIsBookingModalOpen(true);
      };

      useEffect(() => {
        if (selectedService || isBookingModalOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = 'unset';
        }
      }, [selectedService, isBookingModalOpen]);

      useEffect(() => {
        let timeout;
        const handleToast = (e) => {
          setToastMsg(e.detail);
          clearTimeout(timeout);
          timeout = setTimeout(() => setToastMsg(null), 3000);
        };
        window.addEventListener('show-toast', handleToast);
        return () => {
          window.removeEventListener('show-toast', handleToast);
          clearTimeout(timeout);
        };
      }, []);

      return (
        <div className="min-h-screen bg-[#FDFDFC] text-black font-sans selection:bg-gray-200 relative">
          <Header onOpenBooking={() => handleOpenBooking()} />
          <main>
            <HeroSection onOpenBooking={() => handleOpenBooking()} />
            <AboutSection />
            <ServicesMenu onOpenModal={setSelectedService} onOpenBooking={handleOpenBooking} />
          </main>

          {selectedService && (
            <ServiceModal 
              service={selectedService} 
              onClose={() => setSelectedService(null)} 
              onOpenBooking={handleOpenBooking}
            />
          )}

          <BookingModal 
            isOpen={isBookingModalOpen} 
            onClose={() => setIsBookingModalOpen(false)} 
            preselectedService={preselectedService} 
          />
          
          <AnimatePresence>
            {toastMsg && (
              <motion.div
                initial={{ opacity: 0, y: 50, x: '-50%' }}
                animate={{ opacity: 1, y: 0, x: '-50%' }}
                exit={{ opacity: 0, y: 50, x: '-50%' }}
                className="fixed bottom-8 left-1/2 z-[200] bg-black text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-medium whitespace-nowrap"
              >
                <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse" />
                {toastMsg}
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
